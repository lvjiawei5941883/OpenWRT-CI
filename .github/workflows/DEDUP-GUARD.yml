# DEDUP-GUARD.yml
# 并发去重守卫：被 QCA-ALL 等 workflow 以 reusable workflow 方式调用。
# 作用：当目标 workflow 已有其它运行（in_progress/queued）时输出 skip=true，调用方据此跳过，
#       从而规避 workflow_run 与 schedule 双入口造成的同窗口双跑。
# 说明：本文件为 fork 独有定制（上游 VIKINGYFY/OpenWRT-CI 无此文件），merge 上游时不会被覆盖。
name: DEDUP-GUARD

on:
  workflow_call:
    inputs:
      workflow_file:
        description: '被检查的 workflow 文件名，例如 QCA-ALL.yml'
        required: true
        type: string
    outputs:
      skip:
        description: "true 表示检测到同类运行，调用方应跳过本次编译"
        value: ${{ jobs.guard.outputs.skip }}

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 检查是否已有同类运行
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ inputs.workflow_file }}
        run: |
          skip=false
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            others=$(gh run list --workflow "$WF" --limit 100 --json databaseId,status \
              --jq '[.[] | select(.databaseId != (env.GITHUB_RUN_ID|tonumber)) | select(.status=="in_progress" or .status=="queued" or .status=="requested" or .status=="waiting" or .status=="pending")] | length')
            echo "其他进行中的运行数: $others"
            if [ "${others}" -gt 0 ]; then
              skip=true
              echo "检测到同类编译已在运行，本次触发跳过（去重）"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
