# DEDUP-GUARD.yml
# 并发去重守卫：被 QCA-ALL 等 workflow 以 reusable workflow 方式调用。
# 作用：当目标 workflow 已有其它运行（in_progress/queued）时输出 skip=true，调用方据此跳过，
#       从而规避 workflow_run 与 schedule 双入口造成的同窗口双跑。
# 说明：本文件为 fork 独有定制（上游 VIKINGYFY/OpenWRT-CI 无此文件），merge 上游时不会被覆盖。
name: DEDUP-GUARD

on:
  workflow_call:
    inputs:
      workflow_file:
        description: '被检查的 workflow 文件名，例如 QCA-ALL.yml'
        required: true
        type: string
    outputs:
      skip:
        description: "true 表示检测到同类运行，调用方应跳过本次编译"
        value: ${{ jobs.guard.outputs.skip }}

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 检查是否已有同类运行
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ inputs.workflow_file }}
        # 任何异常都不得阻塞编译：出错时视为“未检测到重复”，按正常编译放行（fail-open）
        # 任何异常都不得阻塞编译：出错时视为“未检测到重复”，按正常编译放行（fail-open）
        continue-on-error: true
        run: |
          skip=false
          others=0
          resp=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?per_page=100" || true)
          echo "API 响应前 120 字符: $(printf '%s' "$resp" | head -c 120)"
          others=$(printf '%s' "$resp" | python3 -c 'import sys,json,os; d=json.load(sys.stdin); me=int(os.environ.get("GITHUB_RUN_ID","0")); print(sum(1 for r in d.get("workflow_runs",[]) if r["id"]!=me and r["status"]!="completed"))' 2>/dev/null || echo 0)
          others=$(printf '%s' "$others" | tr -dc '0-9')
          echo "其他进行中的运行数: ${others:-0}"
          if [ -n "$others" ] && [ "$others" -gt 0 ]; then
            skip=true
            echo "检测到同类编译已在运行，本次触发跳过（去重）"
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
