# SPDX-License-Identifier: MIT
# 全自动同步上游 VIKINGYFY/OpenWRT-CI，merge 后精准恢复定制

name: Sync-Upstream

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git || true
          git fetch upstream main

      - name: Check if Sync Needed
        id: check
        run: |
          BEHIND=$(git rev-list --count main..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          if [ "$BEHIND" -eq 0 ]; then
            echo "已是最新，无需同步"
          else
            echo "落后 $BEHIND 个提交，开始同步"
          fi

      - name: Merge Upstream
        if: steps.check.outputs.behind != '0'
        run: |
          git merge upstream/main --no-edit -X theirs

      - name: Apply Custom Patches
        run: |
          # ============================================================
          # QCA-ALL.yml：只保留 IPQ60XX-WIFI-YES 编译
          # ============================================================
          sed -i 's/CONFIG: \[.*\]/CONFIG: [IPQ60XX-WIFI-YES]/' .github/workflows/QCA-ALL.yml

          # ============================================================
          # WRT-CORE.yml：修复上游包名错误
          # ============================================================
          grep -q 'libunistring-dev' .github/workflows/WRT-CORE.yml || \
            sed -i 's/\blibunistring\b/libunistring-dev/g' .github/workflows/WRT-CORE.yml

          # WRT-CORE.yml：删除 gh cache delete 整个 if/fi 块，避免 for/done 空循环语法错误
          # 同时保留旧缓存以利用 restore-keys 回退
          python3 << 'PYEOF'
          with open('.github/workflows/WRT-CORE.yml', 'r') as f:
              lines = f.readlines()

          result = []
          in_block = False
          for line in lines:
              if not in_block and 'steps.check-cache.outputs.cache-hit' in line and line.strip().startswith('if '):
                  in_block = True
                  continue
              if in_block:
                  if line.strip() == 'fi':
                      in_block = False
                  continue
              result.append(line)

          with open('.github/workflows/WRT-CORE.yml', 'w') as f:
              f.writelines(result)

          print('cache cleanup block removed')
          PYEOF

          # ============================================================
          # IPQ60XX-WIFI-YES.txt：只保留京东云2个设备
          # ============================================================
          cat > Config/IPQ60XX-WIFI-YES.txt << 'EOF'
          #设备平台
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          #设备列表
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          EOF

          # ============================================================
          # GENERAL.txt：精准修改
          # ============================================================
          sed -i 's/^CONFIG_PACKAGE_luci-app-homeproxy=y/CONFIG_PACKAGE_luci-app-homeproxy=n/' Config/GENERAL.txt
          sed -i 's/^CONFIG_PACKAGE_luci-app-gecoosac=y/CONFIG_PACKAGE_luci-app-gecoosac=n/' Config/GENERAL.txt
          sed -i 's/^CONFIG_PACKAGE_luci-app-samba4=y/CONFIG_PACKAGE_luci-app-samba4=n/' Config/GENERAL.txt

          # 幂等：已存在则跳过
          grep -q '^CONFIG_PACKAGE_luci-app-nikki=n$' Config/GENERAL.txt || \
            sed -i '/^CONFIG_PACKAGE_luci-app-homeproxy=n$/a CONFIG_PACKAGE_luci-app-nikki=n' Config/GENERAL.txt
          grep -q '^CONFIG_PACKAGE_luci-app-v2raya=n$' Config/GENERAL.txt || \
            sed -i '/^CONFIG_PACKAGE_luci-app-nikki=n$/a CONFIG_PACKAGE_luci-app-v2raya=n' Config/GENERAL.txt
          grep -q '^CONFIG_PACKAGE_luci-app-passwall=n$' Config/GENERAL.txt || \
            sed -i '/^CONFIG_PACKAGE_luci-app-v2raya=n$/a CONFIG_PACKAGE_luci-app-passwall=n' Config/GENERAL.txt

          if ! grep -q '^CONFIG_PACKAGE_luci-app-diskman=y$' Config/GENERAL.txt; then
            sed -i '/^CONFIG_PACKAGE_luci-app-wolultra=y$/a CONFIG_PACKAGE_luci-app-diskman=y\nCONFIG_PACKAGE_luci-app-tailscale=y\nCONFIG_PACKAGE_luci-app-easytier=y\nCONFIG_PACKAGE_luci-app-lucky=y\nCONFIG_PACKAGE_luci-app-mosdns=n\nCONFIG_PACKAGE_luci-app-smartdns=y\nCONFIG_PACKAGE_luci-app-filemanager=y\nCONFIG_PACKAGE_luci-app-usteer=y\nCONFIG_PACKAGE_luci-app-dawn=n\nCONFIG_PACKAGE_luci-app-athena-led=y\nCONFIG_PACKAGE_luci-i18n-athena-led-zh-cn=y\nCONFIG_PACKAGE_luci-app-adguardhome=y' Config/GENERAL.txt
          fi

          if ! grep -q '^CONFIG_PACKAGE_easytier=y$' Config/GENERAL.txt; then
            echo 'CONFIG_PACKAGE_easytier=y' >> Config/GENERAL.txt
          fi

          # ============================================================
          # Packages.sh：追加插件
          # ============================================================
          if ! grep -q 'lucky' Scripts/Packages.sh; then
            sed -i '/^UPDATE_PACKAGE "vnt"/a UPDATE_PACKAGE "lucky" "gdy666/luci-app-lucky" "main"' Scripts/Packages.sh
          fi
          if ! grep -q 'adguardhome' Scripts/Packages.sh; then
            sed -i '/^UPDATE_PACKAGE "lucky"/a UPDATE_PACKAGE "adguardhome" "TanZhiwen2001/luci-app-adguardhome" "main"' Scripts/Packages.sh
          fi
          if ! grep -q 'oxidns' Scripts/Packages.sh; then
            sed -i '/^UPDATE_PACKAGE "adguardhome"/a UPDATE_PACKAGE "oxidns" "svenshi/luci-app-oxidns" "main"' Scripts/Packages.sh
          fi

          # ============================================================
          # GENERAL.txt：追加 oxidns 编译配置
          # ============================================================
          grep -q '^CONFIG_PACKAGE_luci-app-oxidns=y$' Config/GENERAL.txt || \
            sed -i '/^CONFIG_PACKAGE_luci-app-adguardhome=y$/a CONFIG_PACKAGE_luci-app-oxidns=y' Config/GENERAL.txt

          # 提交所有改动
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "sync: 恢复老板的定制"
          fi

      - name: Push
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git -c http.extraheader= push origin main
