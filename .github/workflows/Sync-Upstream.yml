# Sync-Upstream.yml
# 作用：将 fork 与上游 VIKINGYFY/OpenWRT-CI 同步，并在 merge -X theirs 覆盖后
#       以"删行+追加"的固定清单模式恢复/注入老板的定制，最后推回仓库。
# 触发：手动 workflow_dispatch，或下方 cron 定时。
# 注意：本 workflow 只负责"同步上游+打补丁"，不编译固件；编译请再跑 QCA-ALL.yml。

name: Sync-Upstream

on:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00），可自行调整
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git 2>/dev/null || true
          git fetch upstream main

      - name: Merge Upstream (覆盖式)
        run: |
          git merge upstream/main --no-edit -X theirs

      - name: Apply Custom Patches
        run: |
          # ========== 1. 固定 QCA-ALL 编译矩阵：仅 IPQ60XX 的 YES / NO 两套 ==========
          sed -i 's/CONFIG: \[.*\]/CONFIG: [IPQ60XX-WIFI-YES, IPQ60XX-WIFI-NO]/' .github/workflows/QCA-ALL.yml

          # ========== 2. WRT-CORE.yml：修复上游包名 libunistring -> libunistring-dev ==========
          grep -q 'libunistring-dev' .github/workflows/WRT-CORE.yml || \
            sed -i 's/\blibunistring\b/libunistring-dev/g' .github/workflows/WRT-CORE.yml

          # ========== 3. WRT-CORE.yml：删除 gh cache delete 整块（避免 for/done 空循环语法错误） ==========
          python3 << 'PYEOF'
          with open('.github/workflows/WRT-CORE.yml', 'r') as f:
              lines = f.readlines()

          result = []
          in_block = False
          for line in lines:
              if not in_block and 'steps.check-cache.outputs.cache-hit' in line and line.strip().startswith('if '):
                  in_block = True
                  continue
              if in_block:
                  if line.strip() == 'fi':
                      in_block = False
                  continue
              result.append(line)

          with open('.github/workflows/WRT-CORE.yml', 'w') as f:
              f.writelines(result)

          print('cache cleanup block removed')
          PYEOF

          # ========== 4. IPQ60XX-WIFI-YES.txt：仅京东云两台（带WIFI驱动） ==========
          cat > Config/IPQ60XX-WIFI-YES.txt << 'EOF'
          #设备平台
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          #设备列表
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          EOF

          # ========== 5. IPQ60XX-WIFI-NO.txt：仅京东云两台（关闭WIFI驱动） ==========
          cat > Config/IPQ60XX-WIFI-NO.txt << 'EOF'
          #设备平台
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          #设备列表
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          #WIFI驱动
          CONFIG_PACKAGE_kmod-ath=n
          CONFIG_PACKAGE_kmod-ath11k=n
          CONFIG_PACKAGE_kmod-ath11k-ahb=n
          CONFIG_PACKAGE_kmod-ath11k-pci=n
          CONFIG_PACKAGE_ath11k-firmware-ipq6018=n
          CONFIG_PACKAGE_ath11k-firmware-ipq6018-ddwrt=n
          CONFIG_PACKAGE_ath11k-firmware-qcn9074=n
          CONFIG_PACKAGE_ath11k-firmware-qcn9074-ddwrt=n
          EOF

          # ========== 6. GENERAL.txt：固定取消的插件（删行+追加，幂等、不依赖锚点） ==========
          for pkg in homeproxy gecoosac samba4 nikki v2raya passwall; do
            sed -i "/^CONFIG_PACKAGE_luci-app-$pkg=/d" Config/GENERAL.txt
            echo "CONFIG_PACKAGE_luci-app-$pkg=n" >> Config/GENERAL.txt
          done

          # ========== 7. GENERAL.txt：固定增加的插件 ==========
          for pkg in diskman tailscale easytier lucky mosdns smartdns filemanager usteer athena-led adguardhome oxidns; do
            sed -i "/^CONFIG_PACKAGE_luci-app-$pkg=/d" Config/GENERAL.txt
            echo "CONFIG_PACKAGE_luci-app-$pkg=y" >> Config/GENERAL.txt
          done

          # ========== 8. Packages.sh：追加插件源（幂等，存在则跳过） ==========
          for entry in 'lucky|gdy666/luci-app-lucky|main' 'adguardhome|TanZhiwen2001/luci-app-adguardhome|main' 'oxidns|svenshi/luci-app-oxidns|main'; do
            name="${entry%%|*}"; rest="${entry#*|}"
            repo="${rest%%|*}"; branch="${rest#*|}"
            if ! grep -q "UPDATE_PACKAGE \"$name\"" Scripts/Packages.sh; then
              echo "UPDATE_PACKAGE \"$name\" \"$repo\" \"$branch\"" >> Scripts/Packages.sh
            fi
          done

      - name: Commit & Push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "无改动，跳过提交"
            exit 0
          fi
          git commit -m "sync: 同步上游并应用定制补丁"
          # 用 PAT 推送：默认 GITHUB_TOKEN 无 workflows 权限，无法更新 .github/workflows/ 下文件
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin main
