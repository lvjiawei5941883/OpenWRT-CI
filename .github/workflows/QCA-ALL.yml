#CI项目
name: QCA-ALL

#CI计划
on:
  #定时兜底：每天 UTC 21:05（北京时间 05:05），防止 Auto-Clean 偶发跳过导致编译停摆
  #（错开整点，规避 GitHub 整点调度高峰造成的延迟/丢单）
  schedule:
    - cron: '5 21 * * *'
  #自动编译：当Auto-Clean运行完成后（保留原 Auto-Clean → QCA-ALL 链路）
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  #并发去重守卫：同一时刻只保留一条 QCA-ALL 编译，避免 workflow_run 与 schedule 双触发双跑；手动触发豁免
  guard:
    uses: ./.github/workflows/DEDUP-GUARD.yml
    with:
      workflow_file: QCA-ALL.yml

  config:
    name: ${{matrix.CONFIG}}
    needs: [guard]
    if: needs.guard.outputs.skip != 'true'
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES, IPQ60XX-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
